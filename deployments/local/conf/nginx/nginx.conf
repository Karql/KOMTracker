load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr $host $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Compress proxied responses (Kestrel API JSON goes straight through here uncompressed).
    # Web assets already carry Content-Encoding from the app nginx (br/gzip) and are left untouched.
    # Brotli is preferred when the client supports it; gzip is the fallback.
    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      application/json application/javascript text/css text/plain application/xml image/svg+xml;
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        application/json application/javascript text/css text/plain application/xml image/svg+xml;

    # Remove server header
    more_clear_headers Server;
    server_tokens off;

    map $upstream_http_strict_transport_security $hsts {
    ''  max-age=31536000;
    }

    include /etc/nginx/conf.d/*.conf;
}