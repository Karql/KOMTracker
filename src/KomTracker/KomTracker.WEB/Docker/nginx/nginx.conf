user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr $host $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;

        # Content-hashed assets -> cache forever.
        # _framework: hashed in the filename by the SDK (blazor.webassembly.<hash>.js, *.wasm, dotnet.<hash>.js).
        # css/_content: hashed via ?v=<hash> injected by Docker/fingerprint-assets.sh at image build.
        # try_files ... =404 (NOT ... /index.html): a missing asset must 404, not fall back to
        # index.html. The SPA fallback below would otherwise mask a missing/renamed asset by
        # returning HTML with a 200 (which is how the broken Plotly reference stayed invisible).
        location /_framework/ {
            root /app;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /_content/ {
            root /app;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /css/ {
            root /app;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA routes + app shell + runtime config (index.html fallback, appsettings.json, favicons)
        # -> always revalidate so a new deploy is picked up (cheap 304 when unchanged).
        location / {
            root /app;
            try_files $uri $uri/ /index.html =404;
            add_header Cache-Control "no-cache";
        }
    }
}