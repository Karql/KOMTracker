load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }
    default_type  application/octet-stream;

    log_format  main  '$remote_addr $host $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # On-the-fly compression for everything served here (index.html, appsettings.json, _content, svg).
    # *_static (serving the precompressed *.br/*.gz that publish emits) is enabled per-location ONLY for
    # the immutable asset dirs below -- NOT globally -- because the root's index.html is rewritten after
    # publish (fingerprint-assets.sh) and appsettings.json is mounted at runtime, so their published
    # precompressed siblings would be stale. Those root files are compressed on the fly instead.
    # Brotli is preferred by the client when available (better ratio on wasm); gzip is the fallback.
    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      text/css application/javascript application/json image/svg+xml;
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;

        # Content-hashed assets -> cache forever.
        # _framework: hashed in the filename by the SDK (blazor.webassembly.<hash>.js, *.wasm, dotnet.<hash>.js).
        # css/_content: hashed via ?v=<hash> injected by Docker/fingerprint-assets.sh at image build.
        # try_files ... =404 (NOT ... /index.html): a missing asset must 404, not fall back to
        # index.html. The SPA fallback below would otherwise mask a missing/renamed asset by
        # returning HTML with a 200, which silently hides broken references.
        location /_framework/ {
            root /app;
            try_files $uri =404;
            brotli_static on;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /_content/ {
            root /app;
            try_files $uri =404;
            brotli_static on;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /css/ {
            root /app;
            try_files $uri =404;
            brotli_static on;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA routes + app shell + runtime config (index.html fallback, appsettings.json, favicons)
        # -> always revalidate so a new deploy is picked up (cheap 304 when unchanged).
        location / {
            root /app;
            try_files $uri $uri/ /index.html =404;
            add_header Cache-Control "no-cache";
        }
    }
}